name: attach-dmg

# 给已有 Release 补一个 macOS DMG：从该 Release 下载 DBPilot-<ver>-macos.zip，
# 在 macOS runner 上用 hdiutil 生成 DBPilot-<ver>-macos.dmg 并上传回同一个 Release。
# 触发方式：push tag dmg-v1.1.0（用完删除该 tag），或 workflow_dispatch 填 version。

on:
  push:
    tags:
      - "dmg-*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 1.1.0）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: build and attach dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Resolve version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            V="${REF_NAME#dmg-v}"
          else
            V="${INPUT_VERSION#v}"
          fi
          [ -n "$V" ] || { echo "::error::需要版本号（tag dmg-v1.1.0 或 dispatch 输入 1.1.0）"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "目标：$V"

      - name: Download existing macOS zip from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.v.outputs.tag }}" \
            --pattern "DBPilot-${{ steps.v.outputs.version }}-macos.zip" --dir .
          ls -lh *-macos.zip

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          ditto -x -k "DBPilot-$V-macos.zip" app
          mkdir -p dmgroot
          cp -R app/DBPilot.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "DBPilot $V" -srcfolder dmgroot -ov -format UDZO "DBPilot-$V-macos.dmg"
          hdiutil verify "DBPilot-$V-macos.dmg"
          ls -lh "DBPilot-$V-macos.dmg"

      - name: Upload dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.v.outputs.tag }}" \
            "DBPilot-${{ steps.v.outputs.version }}-macos.dmg" --clobber

      - name: Show release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" --json assets --jq '.assets[].name'
