name: build

# 每次 push 到 main / PR / 手动触发：双平台（macOS + Windows）出 Release 包并上传 artifact。
# 发布仓库根 = desktop/ 目录，所以下面的路径都没有 desktop/ 前缀（rust/、lib/、pubspec.yaml …）。
# 真正的发布（建 Release + 更新 update.json）见 release.yml。

on:
  push:
    branches: [main, master]
    # 纯清单 / 纯文档提交不值得跑两平台构建（release 工作流会提交 update.json）
    paths-ignore:
      - "update.json"
      - "**.md"
  # PR 不做 paths-ignore：如果分支保护要求 build 检查，被跳过的 PR 会一直卡在
  # "Expected — Waiting for status to be reported"。文档类 PR 白跑一次构建更省心。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 版本与 release.yml 保持一致（项目实测版本，见 README.md）。
  FLUTTER_VERSION: "3.47.7"
  CARGO_TERM_COLOR: always
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # 两个平台互不阻塞：Windows 失败也要看到 macOS 的结果
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact: macos
            # macOS 产物是 universal（x86_64 + arm64）：cargokit 按 ARCHS 给每个架构各编一份
            # 静态库再 lipo，所以两个 Rust target 都必须预装。
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            artifact: windows-x64
            rust_targets: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # 只缓存 cargo 的下载缓存（registry / git）。这里**故意不缓存 rust/target**：
      # flutter build 走 cargokit，Rust 产物落在 build/ 下的 CARGOKIT_TARGET_TEMP_DIR，
      # 全新 checkout 里根本没有 rust/target 目录（.gitignore 掉了），缓存它只会让
      # actions/cache 报 "Path(s) ... do(es) not exist" 并白白占掉仓库 10 GB 缓存配额。
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Show toolchain versions
        shell: bash
        run: |
          flutter --version
          rustc -vV
          cargo -V

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      # 版本号从 pubspec.yaml 取（唯一版本源；发版时 tag 必须与它一致）。
      # 这一步只用 sed，macOS 与 Windows（Git Bash）都可用。
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::pubspec.yaml 里没有解析到 version"
            exit 1
          fi
          echo "版本：$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ditto 保留 .app 里的符号链接与扩展属性，解压后可直接运行（普通 zip 会丢符号链接）。
      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/DBPilot.app"
          test -d "$APP" || { echo "::error::找不到 $APP"; exit 1; }
          echo "产物架构：$(lipo -archs "$APP/Contents/MacOS/DBPilot" 2>/dev/null || echo unknown)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "DBPilot-$VERSION-macos.zip"
          ls -lh "DBPilot-$VERSION-macos.zip"

      # 代码签名（可选）：配了 secrets 就签，没配就跳过。
      # 证书来源优先级：PFX(base64) > 证书存储指纹；两者都没有时脚本直接 exit 0。
      - name: Decode signing certificate
        # secrets 不能在 job 级 env 里判空，所以这里永远执行、由脚本自己判断。
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host '未配置 WINDOWS_CERT_PFX_BASE64，跳过证书解码（产物不签名）'
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dbpilot-sign.pfx", $bytes)
          Write-Host "证书已解码：$((Get-Item "$env:RUNNER_TEMP\dbpilot-sign.pfx").Length) bytes"

      - name: Sign Windows binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
          CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $pfx = "$env:RUNNER_TEMP\dbpilot-sign.pfx"
          $params = @{ Path = "build/windows/x64/runner/Release" }
          if (Test-Path $pfx) { $params.PfxPath = $pfx }
          if ($env:CERT_PFX_PASSWORD) { $params.PfxPassword = $env:CERT_PFX_PASSWORD }
          if ($env:CERT_THUMBPRINT) { $params.Thumbprint = $env:CERT_THUMBPRINT }
          & .\packaging\windows\sign-windows.ps1 @params

      # NSIS 安装包（主产物）：开始菜单/桌面快捷方式、卸载项、版本信息。
      - name: Build NSIS installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # NSIS 在 windows runner 上的位置随镜像版本变化，不能写死路径：
          # 先找 PATH，再找几个常见目录，最后用 choco 装一次。
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            $candidates = @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe',
              (Join-Path $env:ChocolateyInstall 'bin\makensis.exe')
            )
            $nsis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $nsis) {
            Write-Host 'NSIS 未预装，用 choco 安装 ...'
            choco install nsis -y --no-progress
            $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          }
          if (-not (Test-Path $nsis)) { Write-Error "找不到 makensis.exe（已尝试 PATH / 常见目录 / choco）"; exit 1 }
          Write-Host "使用 makensis: $nsis"
          $args = @(
            "/DVERSION=$env:VERSION",
            "/DSRCDIR=build\windows\x64\runner\Release",
            "/DOUTFILE=DBPilot-$env:VERSION-windows-x64-setup.exe",
            "/DAPP_ICON=windows\runner\resources\app_icon.ico",
            "packaging\windows\installer.nsi"
          )
          & $nsis @args
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis 失败（$LASTEXITCODE）"; exit 1 }
          Get-Item "DBPilot-$env:VERSION-windows-x64-setup.exe" | Select-Object Name, Length | Format-List

      # 给安装包本身签名（必须在 makensis 之后：签名会改变文件字节）。
      - name: Sign Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
          CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          $pfx = "$env:RUNNER_TEMP\dbpilot-sign.pfx"
          $params = @{ Path = "DBPilot-$env:VERSION-windows-x64-setup.exe" }
          if (Test-Path $pfx) { $params.PfxPath = $pfx }
          if ($env:CERT_PFX_PASSWORD) { $params.PfxPassword = $env:CERT_PFX_PASSWORD }
          if ($env:CERT_THUMBPRINT) { $params.Thumbprint = $env:CERT_THUMBPRINT }
          & .\packaging\windows\sign-windows.ps1 @params

      # 免安装 zip（备选）：整个 Release 目录打平，解压即用。
      - name: Package Windows portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          if (-not (Test-Path $rel)) { Write-Error "找不到 $rel"; exit 1 }
          $zip = "DBPilot-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbpilot-${{ matrix.artifact }}
          path: |
            DBPilot-*-${{ matrix.artifact }}.zip
            DBPilot-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
